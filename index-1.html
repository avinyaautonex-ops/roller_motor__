<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <title>Avinya Autonex — Rolling Motor Swing Gate</title>
  <style>
    :root{--blue:#27b7ff;--blue2:#0b73d4;--ink:#06101a;--panel:#0d1925;--muted:#8fa3b7;--progress:0}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#04080d;color:#fff;overflow:hidden}
    button{font:inherit;color:inherit}
    .app{width:100%;height:100%;min-height:420px;display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,31vw,460px);background:radial-gradient(circle at 20% 0,#14314c 0,#07111b 38%,#03070b 100%)}
    .scene{position:relative;min-width:0;overflow:hidden;isolation:isolate;background:linear-gradient(#8da5b1 0 48%,#34414a 48% 50%,#20262c 50%)}
    .scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,13,.08),rgba(2,8,13,.02) 45%,rgba(2,8,13,.58));z-index:8;pointer-events:none}
    .sky{position:absolute;inset:0 0 44%;background:linear-gradient(160deg,#bbcad1,#78909b 65%,#526875);z-index:-4}
    .sky:after{content:"";position:absolute;width:45vmax;height:45vmax;border-radius:50%;right:-19vmax;top:-27vmax;background:rgba(255,240,200,.33);filter:blur(20px)}
    .house{position:absolute;left:8%;right:8%;top:10%;height:55%;background:linear-gradient(90deg,#e7e1d7 0 32%,#c8bdb0 32% 34%,#ece7df 34% 100%);box-shadow:0 20px 50px #0008;z-index:-3}
    .house:before{content:"";position:absolute;left:-3%;right:-3%;top:-8%;height:12%;background:#242b32;clip-path:polygon(3% 100%,10% 0,90% 0,97% 100%)}
    .window{position:absolute;top:22%;width:18%;height:33%;background:linear-gradient(145deg,#15232d,#7393a4);border:7px solid #212931;box-shadow:inset 0 0 0 2px #9eb1bb55}
    .window.one{left:8%}.window.two{right:8%}.window:after{content:"";position:absolute;left:48%;top:0;width:4%;height:100%;background:#27343d}
    .door{position:absolute;left:42%;top:13%;width:16%;height:63%;background:linear-gradient(90deg,#302821,#65584d 48%,#27221e);border:8px solid #292b2d}
    .drive{position:absolute;left:-8%;right:-8%;bottom:-12%;height:60%;background:linear-gradient(165deg,#59636a 0 25%,#42494e 25% 100%);transform:perspective(500px) rotateX(12deg);z-index:-2}
    .drive:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 13%,rgba(255,255,255,.025) 13.2% 13.5%)}
    .brand{position:absolute;z-index:20;left:clamp(14px,2vw,30px);top:clamp(14px,2vw,28px);padding:10px 14px;border:1px solid #ffffff26;border-radius:12px;background:#07111bd9;backdrop-filter:blur(14px);box-shadow:0 12px 35px #0005}
    .brand small{display:block;font-size:clamp(8px,.65vw,11px);letter-spacing:.24em;color:#b9cada}
    .brand strong{display:block;font-size:clamp(15px,1.4vw,23px);letter-spacing:.08em}.brand strong span{color:var(--blue)}
    .gate-stage{position:absolute;z-index:10;left:5%;right:5%;bottom:8%;height:min(45vw,48vh);min-height:190px;perspective:1100px;perspective-origin:50% 55%}
    .pillar{position:absolute;bottom:0;width:7%;min-width:28px;height:82%;background:linear-gradient(90deg,#161c20,#606970 38%,#222a2f 75%,#0c1013);border-top:4px solid #7d898f;box-shadow:0 14px 20px #0009;z-index:6}.pillar.left{left:0}.pillar.right{right:0}
    .leaf{position:absolute;bottom:4%;width:46.5%;height:66%;transform-style:preserve-3d;transition:transform .035s linear;z-index:5;will-change:transform}
    .leaf.left{left:5.8%;transform-origin:left center;transform:rotateY(calc(var(--progress) * 90deg))}
    .leaf.right{right:5.8%;transform-origin:right center;transform:rotateY(calc(var(--progress) * -90deg))}
    .gate-face{position:absolute;inset:0;background:linear-gradient(110deg,#0b0e11,#272c31 25%,#111519 50%,#30363b 78%,#090c0f);border:clamp(4px,.55vw,8px) solid #080a0c;box-shadow:0 15px 28px #000b,inset 0 0 0 2px #59636a;overflow:hidden;backface-visibility:visible}
    .slats{position:absolute;inset:5%;background:repeating-linear-gradient(90deg,#11161a 0 6%,#394147 6.3% 7%,#080b0e 7.3% 9.5%);border:2px solid #050709}
    .brace{position:absolute;left:3%;right:3%;height:5%;background:linear-gradient(#545d63,#101418);box-shadow:0 1px #747e84;z-index:2}.brace.top{top:12%}.brace.mid{top:47%}.brace.bot{bottom:12%}
    .hinges{position:absolute;top:16%;bottom:16%;width:10px;display:flex;flex-direction:column;justify-content:space-between;z-index:8}.left .hinges{left:-5px}.right .hinges{right:-5px}.hinges i{width:10px;height:28px;border-radius:4px;background:#07090b;box-shadow:inset 1px 0 #69747b}
    .motor{position:absolute;bottom:-14%;width:clamp(44px,5.4vw,76px);height:clamp(46px,5.6vw,78px);z-index:10;filter:drop-shadow(0 10px 8px #000b)}
    .left .motor{right:-4%}.right .motor{left:-4%}
    .motor-body{position:absolute;left:17%;right:17%;top:0;height:63%;border-radius:45% 45% 18% 18%;background:linear-gradient(90deg,#0a0e11,#45515a 46%,#0c1115);border:2px solid #050709}
    .motor-body:after{content:"ROLL";position:absolute;inset:34% 0 auto;text-align:center;font-size:clamp(5px,.5vw,8px);font-weight:900;letter-spacing:.1em;color:var(--blue)}
    .wheel{position:absolute;left:8%;right:8%;bottom:0;aspect-ratio:2.3/1;border-radius:50%;background:radial-gradient(ellipse,#38434b 0 22%,#07090b 24% 56%,#56616a 58% 62%,#050607 64%);border:2px solid #030405;transform:rotate(calc(var(--progress) * 450deg))}
    .ground-line{position:absolute;left:3%;right:3%;bottom:3%;height:2px;background:linear-gradient(90deg,transparent,#a4b0b6 14%,#a4b0b6 86%,transparent);z-index:4;opacity:.55}
    .scene-status{position:absolute;z-index:20;left:clamp(14px,2vw,30px);bottom:clamp(14px,2vw,28px);display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:999px;background:#07111bdd;border:1px solid #ffffff24;backdrop-filter:blur(12px);font-size:clamp(11px,1vw,14px);font-weight:800;letter-spacing:.08em}
    .dot{width:9px;height:9px;border-radius:50%;background:#54e68b;box-shadow:0 0 12px #54e68b}.moving .dot{background:var(--blue);box-shadow:0 0 12px var(--blue)}.stopped .dot{background:#ffb33b;box-shadow:0 0 12px #ffb33b}
    .controls{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,3.4vw,52px);background:linear-gradient(150deg,#101d29,#071019 70%);border-left:1px solid #ffffff16;position:relative}
    .eyebrow{color:var(--blue);letter-spacing:.2em;font-size:11px;font-weight:800;margin-bottom:12px}.controls h1{font-size:clamp(26px,3vw,46px);line-height:1.02;letter-spacing:-.035em;margin-bottom:12px}.controls h1 span{color:var(--blue)}
    .sub{color:var(--muted);font-size:clamp(12px,1.05vw,16px);line-height:1.55;max-width:38ch}
    .readout{margin:clamp(22px,4vh,42px) 0 18px;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08;box-shadow:inset 0 1px #ffffff0c}
    .readout-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.readout-head small{color:var(--muted);font-size:10px;letter-spacing:.18em}.percent{font-size:26px;font-weight:900;color:var(--blue)}
    .bar{height:6px;background:#02070b;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:calc(var(--progress) * 100%);background:linear-gradient(90deg,var(--blue2),#59d6ff);border-radius:inherit;box-shadow:0 0 14px var(--blue);transition:width .035s linear}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control-btn{position:relative;min-height:68px;border:1px solid #ffffff1e;border-radius:17px;background:linear-gradient(#1b2a38,#111c27);box-shadow:0 8px 20px #0006,inset 0 1px #ffffff16;cursor:pointer;font-weight:900;letter-spacing:.09em;transition:transform .15s,border-color .15s,filter .15s}.control-btn:hover{border-color:#27b7ff88;filter:brightness(1.1)}.control-btn:active{transform:translateY(2px) scale(.985)}.control-btn span{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.08em}
    .control-btn.stop{grid-column:1/-1;min-height:58px;background:linear-gradient(#522027,#2a1116);border-color:#ff53625c;color:#ff8b95}.control-btn.active{border-color:var(--blue);box-shadow:0 0 0 2px #27b7ff2d,0 8px 25px #0008}
    .hint{margin-top:18px;text-align:center;color:#5f7487;font-size:10px;letter-spacing:.08em}
    @media(max-width:800px){
      html,body{overflow:auto}.app{min-height:100%;height:auto;grid-template-columns:1fr;grid-template-rows:minmax(390px,58svh) auto}.controls{border-left:0;border-top:1px solid #ffffff16;padding:22px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));justify-content:start}.controls h1{font-size:28px}.sub{font-size:13px}.readout{margin:18px 0 14px;padding:14px}.buttons{gap:10px}.control-btn{min-height:60px}.control-btn.stop{min-height:52px}.gate-stage{left:2%;right:2%;bottom:5%;height:48vw;min-height:210px}.brand{top:12px;left:12px}.scene-status{bottom:12px;left:12px}}
    @media(max-width:420px){.app{grid-template-rows:minmax(330px,53svh) auto}.gate-stage{height:55vw;min-height:190px}.controls{padding-top:18px}.controls h1{font-size:24px}.sub{display:none}.readout{margin-top:14px}.brand small{font-size:7px}.brand strong{font-size:14px}}
    @media(max-height:560px) and (orientation:landscape){.app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:100svh}.controls{padding:18px}.controls h1{font-size:25px}.sub{display:none}.readout{margin:16px 0 12px;padding:12px}.control-btn{min-height:52px}.control-btn.stop{min-height:45px}.hint{display:none}.gate-stage{height:72vh;bottom:2%}}
    @media(prefers-reduced-motion:reduce){.leaf,.bar i{transition:none}}
  </style>
</head>
<body>
  <main class="app" aria-label="Interactive rolling motor swing gate demonstration">
    <section class="scene" aria-label="Animated motorized swing gate">
      <div class="sky"></div><div class="house"><div class="window one"></div><div class="window two"></div><div class="door"></div></div><div class="drive"></div>
      <div class="brand"><small>HOME AUTOMATION</small><strong>AVINYA <span>AUTONEX</span></strong></div>
      <div class="gate-stage">
        <div class="ground-line"></div><div class="pillar left"></div><div class="pillar right"></div>
        <div class="leaf left"><div class="gate-face"><div class="slats"></div><i class="brace top"></i><i class="brace mid"></i><i class="brace bot"></i></div><div class="hinges"><i></i><i></i><i></i></div><div class="motor"><div class="motor-body"></div><div class="wheel"></div></div></div>
        <div class="leaf right"><div class="gate-face"><div class="slats"></div><i class="brace top"></i><i class="brace mid"></i><i class="brace bot"></i></div><div class="hinges"><i></i><i></i><i></i></div><div class="motor"><div class="motor-body"></div><div class="wheel"></div></div></div>
      </div>
      <div class="scene-status" id="statusPill"><i class="dot"></i><span id="sceneState">CLOSED</span></div>
    </section>
    <aside class="controls">
      <p class="eyebrow">10 SEC NORMAL OPERATION</p><h1>Rolling Motor<br><span>Swing Gate</span></h1><p class="sub">A responsive interactive demonstration of dual-leaf motorized gates with wheel-mounted rolling motors.</p>
      <div class="readout"><div class="readout-head"><small>GATE POSITION</small><b class="percent" id="percent">0%</b></div><div class="bar"><i></i></div></div>
      <div class="buttons"><button class="control-btn" id="openBtn" type="button">▲ OPEN<span>Tap to open gate</span></button><button class="control-btn" id="closeBtn" type="button">▼ CLOSE<span>Tap to close gate</span></button><button class="control-btn stop" id="stopBtn" type="button">■ EMERGENCY STOP</button></div>
      <p class="hint">WORKS WITH TOUCH, MOUSE &amp; KEYBOARD · O / C / SPACE</p>
    </aside>
  </main>
  <script>
    (()=>{
      const root=document.documentElement, percent=document.getElementById('percent'), state=document.getElementById('sceneState'), pill=document.getElementById('statusPill');
      const openBtn=document.getElementById('openBtn'), closeBtn=document.getElementById('closeBtn'), stopBtn=document.getElementById('stopBtn');
      let position=0,target=0,last=performance.now(),raf=0,stopped=false;
      // Realistic operation: 10 seconds for a complete open or close cycle.
      const DURATION_MS=10000;
      const speed=1/DURATION_MS;
      function paint(label){root.style.setProperty('--progress',position.toFixed(4));percent.textContent=Math.round(position*100)+'%';state.textContent=label;pill.className='scene-status '+(label==='STOPPED'?'stopped':/ING/.test(label)?'moving':'');openBtn.classList.toggle('active',label==='OPENING');closeBtn.classList.toggle('active',label==='CLOSING')}
      function tick(now){const dt=Math.min(now-last,60);last=now;const d=speed*dt;if(Math.abs(target-position)<=d){position=target;paint(position===1?'OPEN':'CLOSED');raf=0;return}position+=Math.sign(target-position)*d;paint(target>position?'OPENING':'CLOSING');raf=requestAnimationFrame(tick)}
      function move(to){target=to;stopped=false;if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
      function stop(){target=position;stopped=true;if(raf){cancelAnimationFrame(raf);raf=0}paint('STOPPED')}
      function vibrate(pattern){if('vibrate' in navigator)navigator.vibrate(pattern)}
      openBtn.addEventListener('click',()=>{vibrate(55);move(1)});
      closeBtn.addEventListener('click',()=>{vibrate(55);move(0)});
      stopBtn.addEventListener('click',()=>{vibrate([55,35,90]);stop()});
      addEventListener('keydown',e=>{if(/input|textarea/i.test(e.target.tagName))return;if(e.key.toLowerCase()==='o')move(1);if(e.key.toLowerCase()==='c')move(0);if(e.code==='Space'){e.preventDefault();stop()}});
      paint('CLOSED');
    })();
  </script>
</body>
</html>
